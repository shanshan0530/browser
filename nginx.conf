map $http_authorization $mcp_authorized {
    default 0;
    "Bearer ${MCP_TOKEN}" 1;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;

    location = /health {
        access_log off;
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 直接进入 noVNC，并自动连接到同源 /websockify。
    location = / {
        auth_basic "Private Browser";
        auth_basic_user_file /data/.htpasswd;
        return 302 /vnc.html?autoconnect=1&resize=scale&path=websockify;
    }

    # noVNC 的 WebSocket 通道必须单独代理。
    location /websockify {
        auth_basic "Private Browser";
        auth_basic_user_file /data/.htpasswd;

        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # MCP：只接受正确的 Bearer Token。
    location /mcp {
        if ($mcp_authorized = 0) {
            return 401;
        }

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # noVNC 的 HTML、JS、CSS 等普通资源，不发送 WebSocket Upgrade 头。
    location / {
        auth_basic "Private Browser";
        auth_basic_user_file /data/.htpasswd;

        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300;
    }
}
