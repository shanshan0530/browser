map $http_authorization $mcp_authorized {
    default 0;
    "Bearer ${MCP_TOKEN}" 1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;

    location = /health {
        access_log off;
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /vnc.html?autoconnect=1&resize=scale&path=websockify;
    }

    # MCP：只接受正确的 Bearer Token。
    location /mcp {
        if ($mcp_authorized = 0) {
            return 401;
        }

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # noVNC 页面和 WebSocket 统一交给 websockify。
    # 普通静态请求不再被强制升级；只有真正的 WebSocket 请求才升级。
    location / {
        auth_basic "Private Browser";
        auth_basic_user_file /data/.htpasswd;

        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
